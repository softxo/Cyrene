name: Bug report
description: Something on the website, bot or Scanner isn't working.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: >-
              Remove account cookies, Wish History URLs and other personal information from
              logs and screenshots. Security problems go to Cyrene Staff on Discord, not here.
    - type: dropdown
      id: area
      attributes:
          label: Where did it happen?
          options:
              - Website
              - Discord bot
              - Cyrene Scanner
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: What you saw, and what you expected instead.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open the Characters page
              2. Click …
      validations:
          required: true
    - type: input
      id: page
      attributes:
          label: Page or command
          placeholder: /characters, /resin, …
    - type: input
      id: environment
      attributes:
          label: Browser or device
          placeholder: Chrome 140 on Windows 11
    - type: textarea
      id: extra
      attributes:
          label: Screenshots or logs
