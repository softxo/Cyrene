name: Feature request
description: Suggest something new or an improvement.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What would you like?
          description: The problem it solves or what it would make easier.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: How could it work?
          description: Optional. Describe or sketch the behaviour you have in mind.
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Website
              - Discord bot
              - Cyrene Scanner
