name: Build Achievement Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/CyreneAchievementScanner/**"
      - ".github/workflows/achievement-scanner.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build single-file scanner
        shell: pwsh
        run: ./tools/CyreneAchievementScanner/build.ps1

      - name: Upload scanner
        uses: actions/upload-artifact@v4
        with:
          name: CyreneAchievementScanner-win-x64
          path: |
            tools/CyreneAchievementScanner/dist/CyreneAchievementScanner.exe
            tools/CyreneAchievementScanner/dist/CyreneAchievementScanner-win-x64.zip
            tools/CyreneAchievementScanner/dist/Yae-*-source.zip
          if-no-files-found: error
