{% extends "base.html" %}

{% block title %}Cyrene • Verify{% endblock %}

{% block content %}

<div class="page verification-page">

    <section class="verification-panel">

        <h1>
            Verify your account
        </h1>

        <p class="verification-description">
            Use the code below with the
            <strong>/verify</strong>
            command in Discord.
        </p>

        <div class="verification-code">
            <span id="verification-code">
                Generating...
            </span>
        </div>

        <p
            id="verification-status"
            class="verification-status"
            aria-live="polite"
        >
            Awaiting Verification
        </p>

        <div
            id="verification-success"
            class="verification-success"
            role="status"
            aria-hidden="true"
        >
            <div class="verified-icon" aria-hidden="true">
                <span class="verified-corner top-left"></span>
                <span class="verified-corner top-right"></span>
                <span class="verified-corner bottom-left"></span>
                <span class="verified-corner bottom-right"></span>
                <span class="verified-scan-line"></span>

                <svg class="verified-check" viewBox="0 0 64 64" focusable="false">
                    <path d="M17 33.5 27.5 44 48 22"></path>
                </svg>
            </div>

            <h2>Verified</h2>
            <p>Discord connected successfully.</p>
        </div>

    </section>

</div>

<div
    id="verification-data"
    data-next="{{ next or '/planner' }}"
></div>

{% endblock %}
